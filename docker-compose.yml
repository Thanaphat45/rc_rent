# One-command local stack: MySQL (fresh demo DB) + API + Vite dev server
#   docker compose up
# Web: http://localhost:5173   API: http://localhost:5000/api
# Demo logins: demo_admin / Demo@2026 (admin), demo_user / Demo@2026
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_DATABASE: rcrent
    volumes:
      - ./car-rental-backend/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./car-rental-backend/database/seed-demo.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-prootpw"]
      interval: 5s
      retries: 30

  api:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && node server.js"
    volumes: ["./car-rental-backend:/app", "api_modules:/app/node_modules"]
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: rootpw
      DB_NAME: rcrent
      JWT_SECRET: dev-only-change-me
      FRONTEND_URL: http://localhost:5173
    ports: ["5000:5000"]
    depends_on:
      db: { condition: service_healthy }

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npx vite --host 0.0.0.0 --port 5173"
    volumes: [".:/app", "web_modules:/app/node_modules"]
    environment:
      VITE_API_URL: http://localhost:5000/api
    ports: ["5173:5173"]
    depends_on: [api]

volumes:
  api_modules:
  web_modules:
